name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Actions 탭에서 수동 실행
  workflow_dispatch:
  # Notion 새 글 반영: 매일 03:00 KST (18:00 UTC)
  # 참고: 공개 저장소에 60일간 커밋이 없으면 GitHub가 schedule을 자동 비활성화합니다.
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Notion에서 내려받은 이미지를 실행 간에 재사용 (변경된 파일만 새로 받음)
      - name: Restore Notion images cache
        uses: actions/cache@v4
        with:
          path: public/notion-images
          key: notion-images-${{ github.run_id }}
          restore-keys: notion-images-

      - name: Install dependencies
        run: npm ci

      # prebuild(scripts/fetch-notion.js) → astro build
      - name: Build
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
